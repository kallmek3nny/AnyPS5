name: Validate idle store debounce

on:
  push:
    branches: [experiment/agc-idle-store-debounce]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Vulkan and audio dependencies
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure
        id: configure
        continue-on-error: true
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Build focused regression
        id: build
        if: always() && steps.configure.outcome == 'success'
        continue-on-error: true
        run: cmake --build build --target agc_driver_store_idle_results_tests --parallel 4
      - name: Run focused regression
        id: test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: ctest --test-dir build -R '^agc_driver_store_idle_results$' --output-on-failure --repeat until-fail:3 --timeout 120
      - name: Report outcomes without failing the workflow
        if: always()
        run: echo "configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"
