name: Patch weak imports

on:
  push:
    branches: [fix/relinker-weak-imports]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/relinker-weak-imports
      - name: Apply guarded patch
        run: python3 tools/patch_weak_imports_ci.py
      - name: Check diff
        run: git diff --check
      - name: Configure relinker tests
        run: cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON
      - name: Build relinker tests
        run: cmake --build build-relinker --parallel 3
      - name: Run relinker tests
        run: ctest --test-dir build-relinker --output-on-failure --timeout 120
      - name: Commit patch
        run: |
          git config user.name 'ChatGPT AI-assisted'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/relinker/domain/include/domain/Types.hpp
          git add core/relinker/relinker/src/pipeline/RelinkerPipeline.cpp
          git add core/relinker/relinker/src/output/SysVDynamicSectionBuilder.cpp
          git add core/relinker/elfpatcher/include/elfpatcher/windows/WindowsPeFormat.hpp
          git add core/relinker/elfpatcher/src/windows/WindowsRelocationBuilder.cpp
          git add core/relinker/elfpatcher/src/windows/WindowsEntryStubBuilder.cpp
          git add core/relinker/relinker/tests/StrictNidFilterTests.cpp
          git add core/relinker/relinker/tests/test_windows_import_modules.py
          git commit -m 'fix(relinker): preserve weak imports'
          git push origin HEAD:fix/relinker-weak-imports
