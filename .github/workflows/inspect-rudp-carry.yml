name: Inspect RUDP carry sync

on:
  push:
    branches: [carry/rudp-absent-calls]
    paths: [.github/workflows/inspect-rudp-carry.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect merge conflicts
        id: merge
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/boykopovar/AnyPS5.git || true
          git fetch upstream main
          git reset --hard a5b1cf2b635dd07bbb9ce3ce1d3588f9a5cfae83
          if git merge --no-commit --no-ff upstream/main; then
            echo 'MERGE_CLEAN=1'
            git diff --check upstream/main...HEAD
          else
            echo 'MERGE_CLEAN=0'
            echo 'CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'CONFLICTS_END'
            git checkout --conflict=diff3 -- core/libs/prx/libSceRudp/Export.cpp docs/dev/TechnicalDebt.md
            python3 - <<'PY'
          from pathlib import Path
          for name in ['core/libs/prx/libSceRudp/Export.cpp', 'docs/dev/TechnicalDebt.md']:
              print(f'===== {name} =====')
              lines = Path(name).read_text().splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('<<<<<<<'):
                      end = i
                      while end < len(lines) and not lines[end].startswith('>>>>>>>'):
                          end += 1
                      lo = max(0, i - 8)
                      hi = min(len(lines), end + 9)
                      print('\n'.join(f'{n+1}: {lines[n]}' for n in range(lo, hi)))
                      print('===== HUNK END =====')
          PY
          fi
      - name: Keep inspection non-red
        if: always()
        run: echo "merge_outcome=${{ steps.merge.outcome }}"
